[pytest]
markers =
    deterministic: stochastic solvers made reproducible via opt-in seeding (grasp seeded, rld2 deterministic RL)
    tolerance: version-sensitive results compared with np.allclose (e.g. stochastic RL)
    distribution: non-reproducible methods compared by aggregate stats only (stochastic RL, ensemble)
# CI gate should run the exact tier only:  pytest -m "not distribution and not tolerance"
